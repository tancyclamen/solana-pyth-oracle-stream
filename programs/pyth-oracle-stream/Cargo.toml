[package]
name = "pyth-oracle-stream"
version = "0.1.0"
description = "High-throughput on-chain oracle price feed consumer and TWAP accumulator on Solana built with Anchor Framework and Pyth Network"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]
name = "pyth_oracle_stream"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = "0.30.1"
pyth-sdk-solana = "0.10.3"
solana-program = "~1.18.0"
thiserror = "1.0.63"
